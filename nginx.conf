server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # el modelo .glb es grande
    client_max_body_size 50m;

    # compresión (el .glb y el JS se comprimen bien)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json model/gltf-binary model/gltf+json application/octet-stream image/svg+xml;

    # archivos con hash en el nombre (dist/assets): caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # escena.json siempre fresca (se puede reemplazar sin recompilar)
    location = /escena.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # modelos 3D: tipo propio (el resto usa los tipos por defecto de nginx)
    location ~* \.(glb|gltf)$ {
        types {
            model/gltf-binary glb;
            model/gltf+json   gltf;
        }
        expires 1d;
        try_files $uri =404;
    }

    # texturas: caché de 1 día
    location ~* \.(jpg|jpeg|png|webp|ktx2|hdr)$ {
        expires 1d;
        try_files $uri =404;
    }

    # no existe API de guardado en producción: responder 404 rápido
    location /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
