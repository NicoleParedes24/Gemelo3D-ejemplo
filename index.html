<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>EcoCampus 3D · Microrred renovable</title>
<style>
  :root {
    --solar: #ffc531; --wind: #49d6ff; --batt: #62ff9a; --load: #ff6f4d; --ev: #b98bff; --grid: #dfe8ff;
    --glass: rgba(12, 18, 26, 0.62); --line: rgba(255, 255, 255, 0.1); --txt: #eef3f8; --dim: #9fb0c0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0f15; color: var(--txt);
    font: 14px/1.35 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  #app, #app canvas { position: fixed; inset: 0; display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35); }

  /* marca */
  #brand { position: fixed; top: 18px; left: 18px; padding: 12px 16px; display: flex; gap: 11px; align-items: center; }
  #brand .logo { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(145deg, #23a878, #28c9d6); box-shadow: 0 4px 16px rgba(40,201,214,.24); }
  #brand h1 { margin: 0; font-size: 16px; letter-spacing: 0.09em; font-weight: 750; }
  #brand .mode { color: var(--dim); font-size: 11px; padding: 4px 7px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  .live.off { background: #ff6f4d; box-shadow: 0 0 8px #ff6f4d; }
  #cards-sm { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  #cards-sm:empty { display: none; }
  .mini { background: rgba(255, 255, 255, 0.035); border-radius: 9px; padding: 7px 9px; cursor: default; }
  .mini span { display: block; font-size: 10.5px; color: var(--dim); }
  .mini b { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--c); }
  .card.stale .val, .mini.stale b { opacity: 0.45; }
  #cards { display: flex; flex-direction: column; gap: 6px; }
  #cards .group-title { padding: 7px 2px 2px; border-top: 1px solid var(--line); color: var(--dim); font-size: 10.5px; letter-spacing: .025em; }
  #cards .group-title:first-child { border-top: 0; padding-top: 2px; }
  .lbl.stale { opacity: 0.6; filter: grayscale(0.7); }
  .lbl .v2 { color: var(--dim, #9fb0c0); font-weight: 500; }
  .lbl .v2:empty, .lbl .v1:empty { display: none; }
  body.editing .lbl { pointer-events: auto; cursor: pointer; }
  .lbl.sel { outline: 2px solid #49d6ff; outline-offset: 2px; }
  body.live-mode .knobs, body.live-mode .speeds, body.live-mode #play, body.live-mode .timeline { display: none; }
  body.live-mode #dock { width: auto; grid-template-columns: auto; padding: 10px 18px; }
  .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--batt); margin-right: 6px;
    box-shadow: 0 0 8px var(--batt); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }




  /* créditos */
  #creditos { position: fixed; left: 18px; bottom: 18px; width: min(390px, calc(100vw - 36px)); padding: 10px 14px; font-size: 12px; z-index: 5;
    background: rgba(16, 20, 24, .84); border-color: rgba(255,255,255,.13); box-shadow: 0 8px 28px rgba(0,0,0,.28); }
  #creditos .credit-meta { display: flex; align-items: baseline; flex-wrap: wrap; gap: 7px; }
  #creditos .credit-project { color: #f2f4f5; font-size: 13px; font-weight: 650; letter-spacing: .015em; }
  #creditos .credit-separator { color: rgba(235,240,244,.35); }
  #creditos .credit-school { color: rgba(235,240,244,.67); font-size: 11px; }
  #creditos .credit-divider { height: 1px; margin: 8px 0 7px; background: rgba(255,255,255,.12); }
  #creditos .cols { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; }
  #creditos .cols div { display: flex; flex-direction: column; gap: 4px; }
  #creditos b { font-weight: 500; color: rgba(245,247,248,.9); }
  #creditos small { color: var(--dim); font-size: 11.5px; }
  @media (max-width: 900px) {
    #creditos { left: 18px; bottom: 18px; max-width: min(380px, calc(100vw - 36px)); }
  }

  /* energía del Bloque H */
  #energia-h { position: fixed; right: 18px; bottom: 76px; padding: 10px 14px; min-width: 230px; display: none; font-size: 12px; }
  body.bh-open #energia-h, body.touring #energia-h { display: block; }
  #energia-h h4 { margin: 0 0 6px; font-size: 13px; }
  #energia-h div { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--dim); }
  #energia-h i { width: 14px; height: 3px; border-radius: 2px; background: var(--c); box-shadow: 0 0 6px var(--c); }
  #energia-h b { margin-left: auto; color: var(--c); font-variant-numeric: tabular-nums; }

  /* recorrido guiado: rótulo pequeño y discreto */
  #tour { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); display: none; z-index: 20; }
  body.touring #tour { display: block; }
  body.touring #panel, body.touring #dock, body.touring #legend, body.touring #labels { opacity: 0; pointer-events: none; transition: opacity .4s; }
  .tour-card { display: flex; align-items: center; gap: 10px; padding: 4px 10px; border-radius: 999px;
    background: rgba(12, 18, 26, 0.38); box-shadow: none; }
  .tour-card b:empty { display: none; }
  .tour-card b { font-size: 13px; font-weight: 600; letter-spacing: .03em; color: rgba(255,255,255,.88); }
  .tour-card span, .tour-card .dots { display: none; }
  .tour-stop { background: none; border: none; color: rgba(255,255,255,.45); padding: 2px 6px; font: inherit; font-size: 11px; cursor: pointer; }
  .tour-stop:hover { color: #fff; }
  #tour.fade .tour-card b { animation: tourIn .6s ease; }
  @keyframes tourIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* panel */
  #panel { position: fixed; top: 92px; left: 18px; width: 268px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .card { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 11px;
    background: rgba(255, 255, 255, 0.035); border: 1px solid transparent; cursor: pointer; color: inherit; text-align: left; font: inherit; width: 100%;
    transition: background 0.15s, border-color 0.15s; }
  .card:hover { background: rgba(255, 255, 255, 0.09); border-color: var(--c); }
  .card .ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); }
  .card .name { font-size: 12px; color: var(--dim); }
  .card .sub { font-size: 11px; color: var(--dim); opacity: 0.85; }
  .card .val { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--c); white-space: nowrap; }
  .card .val small { font-size: 11px; font-weight: 500; color: var(--dim); margin-left: 3px; }
  .sep { height: 1px; background: var(--line); margin: 4px 2px; }
  .mixrow { padding: 4px 8px 6px; }
  .mixrow .t { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); margin-bottom: 6px; }
  .mixrow .t b { color: var(--txt); font-variant-numeric: tabular-nums; }
  #mix { display: flex; height: 9px; border-radius: 6px; overflow: hidden; background: rgba(255, 255, 255, 0.08); }
  #mix i { display: block; height: 100%; transition: width 0.3s; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 2px 4px 4px; }
  .stats div { background: rgba(255, 255, 255, 0.035); border-radius: 9px; padding: 7px 9px; }
  .stats span { display: block; font-size: 10.5px; color: var(--dim); }
  .stats b { font-size: 14px; font-variant-numeric: tabular-nums; }
  #panel.dashboard-ref { width: 272px; padding: 10px 12px 8px; gap: 4px; }
  #panel.dashboard-ref #cards { gap: 0; }
  #panel.dashboard-ref .card { grid-template-columns: 14px 1fr auto; gap: 9px; padding: 8px 2px; border: 0; border-radius: 0; background: transparent; }
  #panel.dashboard-ref .card:hover { background: rgba(255,255,255,.055); }
  #panel.dashboard-ref .card .ico { width: 14px; height: 3px; border-radius: 3px; background: var(--c); box-shadow: 0 0 7px color-mix(in srgb, var(--c) 60%, transparent); }
  #panel.dashboard-ref .card .ico svg { display: none; }
  #panel.dashboard-ref .card .name { color: var(--txt); font-size: 12px; }
  #panel.dashboard-ref .card .sub { display: none; }
  #panel.dashboard-ref .card .val { font-size: 15px; }
  #panel.dashboard-ref .card .meter { grid-column: 2 / 4; height: 3px; margin: -4px 3px 0 0; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
  #panel.dashboard-ref .card .meter i { display: block; height: 100%; width: 0; background: var(--c); transition: width .25s; }
  #panel.dashboard-ref #cards-sm { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 2px; }
  #panel.dashboard-ref .mini { background: transparent; padding: 3px 2px; }
  #panel.dashboard-ref .mini span { font-size: 10px; }
  #panel.dashboard-ref .mini b { color: var(--txt); font-size: 14px; }

  /* dock */
  #dock { position: fixed; right: 18px; bottom: 12px; width: min(720px, calc(100vw - 36px));
    padding: 6px 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; border-radius: 12px; }
  .transport { display: flex; align-items: center; gap: 10px; }
  #play { width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer; background: #fff; color: #0c121a; display: grid; place-items: center; }
  #clock { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; min-width: 50px; }
  #phase { display: none; }
  #phase { font-size: 11px; color: var(--dim); }
  .speeds { display: flex; gap: 3px; margin-top: 3px; }
  .speeds button, .pill { border: 1px solid var(--line); background: transparent; color: var(--dim); border-radius: 7px; font: inherit; font-size: 11px;
    padding: 2px 7px; cursor: pointer; }
  .speeds button.on, .pill.on { background: rgba(255, 255, 255, 0.16); color: #fff; }
  .timeline { position: relative; height: 34px; }
  #chart { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 9px; background: rgba(255, 255, 255, 0.03); }
  #hour { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
  .ticks { position: absolute; left: 0; right: 0; bottom: -13px; display: flex; justify-content: space-between; font-size: 9px; color: var(--dim); pointer-events: none; }
  .knobs { display: grid; gap: 4px; min-width: 110px; }
  .knob label { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); margin-bottom: 2px; }
  .knob label b { color: var(--txt); font-variant-numeric: tabular-nums; }
  input[type="range"].r { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.18); outline: none; }
  input[type="range"].r::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: var(--c, #fff); cursor: pointer; border: 2px solid #0c121a; }
  input[type="range"].r::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--c, #fff); cursor: pointer; border: 2px solid #0c121a; }

  /* esquina derecha */
  #tools { position: fixed; top: 18px; right: 18px; display: flex; gap: 8px; }
  #tools .pill { padding: 8px 12px; font-size: 12px; border-radius: 11px; background: var(--glass); backdrop-filter: blur(14px); color: var(--txt); }
  #legend { position: fixed; right: 18px; top: 66px; padding: 10px 14px; font-size: 11.5px; color: var(--dim); display: grid; gap: 5px; }
  #legend div { display: flex; align-items: center; gap: 8px; }
  #legend i { width: 22px; height: 4px; border-radius: 3px; background: var(--c); box-shadow: 0 0 8px var(--c); }
  #hint { position: fixed; right: 18px; bottom: 70px; font-size: 11px; color: rgba(255, 255, 255, 0.55); text-shadow: 0 1px 3px #000; }

  /* etiquetas 3D */
  .lbl { display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px 7px; border-radius: 20px; white-space: nowrap; font-size: 11.5px;
    background: rgba(10, 15, 22, 0.72); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); color: #fff;
    transform-origin: 50% 100%; margin-top: -14px; }
  .lbl::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 14px; background: var(--c); opacity: 0.7; }
  .lbl i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }
  .lbl b { font-weight: 600; }
  .lbl span { color: var(--c); font-variant-numeric: tabular-nums; font-weight: 600; }
  body.nolabels #labels { display: none; }

  #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #0a0f15; z-index: 10; transition: opacity 0.6s; font-size: 13px; color: var(--dim); letter-spacing: 0.2em; }
  #boot.done { opacity: 0; pointer-events: none; }

  @media (max-width: 860px) {
    #panel { width: 210px; top: 84px; } .card .sub, #legend, #hint, .stats { display: none; }
    #dock { grid-template-columns: 1fr; gap: 20px; } .knobs { grid-template-columns: 1fr 1fr; }
  }
  @media (min-width: 420px) and (max-width: 860px) {
    #panel.dashboard-ref { width: 295px; }
    .card .sub { display: block; }
    .stats { display: grid; }
  }
  @media (max-width: 419px) {
    #creditos { bottom: 18px; padding: 9px 11px; font-size: 11px; }
    #creditos .cols { column-gap: 14px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="boot">CONSTRUYENDO CAMPUS…</div>
<script>
  // si algo falla al arrancar, mostrar el error en vez de quedarse en negro
  (function () {
    const show = (m) => {
      const b = document.getElementById('boot');
      if (b && !b.classList.contains('done')) {
        b.style.letterSpacing = '0'; b.style.whiteSpace = 'pre-wrap'; b.style.textAlign = 'center'; b.style.padding = '24px';
        b.textContent = 'No se pudo cargar el campus:\n' + m + '\n\n(F12 → Consola para más detalle)';
      }
    };
    addEventListener('error', (e) => show(e.message || String(e.error)));
    addEventListener('unhandledrejection', (e) => show(String(e.reason && (e.reason.stack || e.reason.message) || e.reason)));
  })();
</script>

<header id="brand" class="glass">
  <div class="logo"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Energía renovable"><path d="M19.5 4.5C12 4.2 6.3 6.8 5.2 12.3c-.6 3 1.5 5.2 4.3 4.8 5.3-.8 8.4-5.8 10-12.6Z"/><path d="m13.8 8.5-4.4 6h3.4l-1 4.8 4.8-6.8h-3.4l.6-4Z"/></svg></div>
  <div class="brand-title"><h1>ECOCAMPUS</h1></div>
  <span class="mode">Simulación</span>
</header>

<aside id="panel" class="glass dashboard-ref"><div id="cards"></div><div id="cards-sm"></div></aside>

<div id="tools">
  <button class="pill" id="t-edit">✎ Editar escena</button>
  <button class="pill on" id="t-labels">Etiquetas</button>
  <button class="pill" id="t-home">Vista general</button>
  <button class="pill" id="t-bh">Ver interior Bloque H</button>
  <button class="pill" id="t-tour">▶ Recorrido Bloque H</button>
</div>
<div id="creditos" class="glass">
  <div class="credit-meta"><span class="credit-project">EcoCampus 2026</span><span class="credit-separator">|</span><span class="credit-school">Universidad Politécnica Salesiana</span></div>
  <div class="credit-divider"></div>
  <div class="cols">
    <div><b>Marcelo García</b><b>Daniela Galarza</b></div>
    <div><b>Rodrigo Tufiño</b><b>Nicole Paredes</b></div>
  </div>
</div>
<div id="hint">Arrastra para orbitar · rueda para acercar · clic derecho para desplazar</div>

<footer id="dock" class="glass">
  <div class="transport">
    <button id="play" aria-label="Reproducir o pausar"></button>
    <div>
      <div id="clock">15:12</div>
      <div id="phase">Tarde</div>
      <div class="speeds"><button data-s="1" class="on">×1</button><button data-s="4">×4</button><button data-s="12">×12</button></div>
    </div>
  </div>
  <div class="timeline">
    <canvas id="chart"></canvas>
    <input id="hour" type="range" min="0" max="24" step="0.02" value="15.2" aria-label="Hora del día" />
    <div class="ticks"><span>00</span><span>03</span><span>06</span><span>09</span><span>12</span><span>15</span><span>18</span><span>21</span><span>24</span></div>
  </div>
  <div class="knobs">
    <div class="knob" style="--c:var(--wind)"><label>Viento <b id="l-wind">9 m/s</b></label><input class="r" id="wind" type="range" min="0" max="26" step="0.5" value="9" /></div>
    <div class="knob" style="--c:#cfd8e3" hidden><label>Nubosidad <b id="l-cloud">0%</b></label><input class="r" id="cloud" type="range" min="0" max="1" step="0.01" value="0" /></div>
  </div>
</footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
